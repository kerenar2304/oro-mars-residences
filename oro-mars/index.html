<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ORO — Mars Residences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Sansation';src:url('public/fonts/Sansation-Light.ttf') format('truetype');font-weight:300;font-display:swap}
  @font-face{font-family:'Sansation';src:url('public/fonts/Sansation-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
  @font-face{font-family:'Sansation';src:url('public/fonts/Sansation-Bold.ttf') format('truetype');font-weight:700;font-display:swap}

  :root{
    --ink:#070503;
    --sand:#EFE3D4;
    --sand-dim:rgba(239,227,212,.62);
    --terra:#C4693F;
    --gold:#E3B072;
    --rule:rgba(239,227,212,.18);
    --display:'Bruno Ace','Sansation',system-ui,sans-serif;
    --body:'Sansation',system-ui,-apple-system,sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{
    background:var(--ink);color:var(--sand);font-family:var(--body);font-weight:300;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--terra);color:#fff}

  /* ---------- stage ---------- */
  #stage{position:fixed;inset:0;z-index:1;overflow:hidden;background:var(--ink)}
  #frame{display:block;width:100%;height:100%}
  #stage::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 40%, transparent 40%, rgba(7,5,3,.55) 100%),
      linear-gradient(180deg, rgba(7,5,3,.78) 0%, transparent 26%, transparent 60%, rgba(7,5,3,.86) 100%);
  }
  /* a whisper of film grain — it keeps the compressed frames from looking flat */
  #grain{
    position:fixed;inset:0;z-index:12;pointer-events:none;opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    background-size:160px 160px;
  }

  #spacer{position:relative;z-index:0;width:100%}

  /* ---------- header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:60;   /* above the menu, so the burger becomes its close X */
    display:flex;align-items:center;justify-content:space-between;
    padding:clamp(18px,2.6vw,34px) clamp(20px,3.4vw,48px);
    mix-blend-mode:normal;
  }
  .lockup{display:flex;flex-direction:column;align-items:flex-start;gap:.42em;line-height:1;text-decoration:none;color:var(--sand)}
  .lockup .oro{display:block;font-family:var(--display);font-size:clamp(24px,2.6vw,38px);letter-spacing:.02em}
  .lockup .sub{
    display:block;white-space:nowrap;transform-origin:left center;
    font-family:var(--body);font-weight:300;font-size:clamp(8px,.78vw,11px);
    letter-spacing:.12em;color:var(--sand-dim);
  }

  .burger{
    -webkit-appearance:none;appearance:none;background:transparent;border:0;cursor:pointer;
    width:46px;height:46px;display:grid;place-content:center;gap:7px;color:var(--sand);
  }
  .burger span{display:block;width:26px;height:1px;background:currentColor;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .25s}
  body.menu-open .burger span:nth-child(1){transform:translateY(4px) rotate(45deg)}
  body.menu-open .burger span:nth-child(2){opacity:0}
  body.menu-open .burger span:nth-child(3){transform:translateY(-4px) rotate(-45deg)}

  /* ---------- progress dots ---------- */
  .dots{
    position:fixed;z-index:40;right:clamp(16px,2.2vw,34px);top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;align-items:flex-end;gap:clamp(12px,1.5vh,20px);
  }
  /* a hairline rail behind the dots that fills with overall progress */
  .dots::before{
    content:'';position:absolute;right:3px;top:-16px;bottom:-16px;width:1px;
    background:rgba(239,227,212,.14);
  }
  .dots .rail{
    position:absolute;right:3px;top:-16px;width:1px;height:calc(100% + 32px);
    background:linear-gradient(180deg, var(--gold), rgba(227,176,114,.35));
    transform-origin:top;transform:scaleY(0);
  }
  .dot{
    -webkit-appearance:none;appearance:none;background:transparent;border:0;cursor:pointer;padding:0;
    display:flex;align-items:center;gap:10px;color:var(--sand);
  }
  .dot i{
    display:block;width:7px;height:7px;border-radius:50%;
    border:1px solid rgba(239,227,212,.45);background:transparent;
    transition:background .4s ease,border-color .4s ease,transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .dot b{
    font-family:var(--body);font-weight:300;font-size:9px;letter-spacing:.28em;text-transform:uppercase;
    opacity:0;transform:translateX(6px);transition:opacity .35s ease,transform .35s ease;white-space:nowrap;
    color:var(--sand-dim);
  }
  .dot:hover b{opacity:1;transform:translateX(0)}
  .dot.active i{background:var(--gold);border-color:var(--gold);transform:scale(1.5)}
  .dot.active b{opacity:1;transform:translateX(0);color:var(--sand)}

  /* ---------- left rail copy ---------- */
  .copy-layer{position:fixed;inset:0;z-index:20;pointer-events:none}
  .slide{
    position:absolute;left:0;right:0;bottom:clamp(74px,10.5vh,116px);
    padding:0 clamp(20px,3.4vw,48px);
    opacity:0;visibility:hidden;
  }
  /* copy arrives in sequence: rule, chapter, headline, action */
  .slide .ch,.slide .cap,.slide .cta{
    opacity:0;transform:translateY(16px);
    transition:opacity .85s ease, transform .95s cubic-bezier(.16,.84,.24,1);
  }
  .slide .ch{transition-delay:.04s}
  .slide .cap{transition-delay:.14s}
  .slide .cta{transition-delay:.28s}
  .slide.in .ch,.slide.in .cap,.slide.in .cta{opacity:1;transform:none}

  .ch{
    position:relative;font-size:9px;letter-spacing:.4em;text-transform:uppercase;
    color:var(--gold);margin-bottom:1em;padding-left:34px;
  }
  .ch::before{
    content:'';position:absolute;left:0;top:50%;width:24px;height:1px;
    background:var(--gold);transform-origin:left;transform:scaleX(0);
    transition:transform 1s cubic-bezier(.16,.84,.24,1) .1s;
  }
  .slide.in .ch::before{transform:scaleX(1)}
  .cap{
    font-family:var(--display);font-weight:400;letter-spacing:.01em;
    font-size:clamp(16px,1.35vw,21px);line-height:1.4;max-width:34ch;
  }
  .cap i{display:block;font-style:normal;color:var(--sand-dim)}
  /* every chapter between the first and last frame shares one type scale */
  .slide:not(.hero):not(.final) .cap i{
    font-size:clamp(12.5px,1.02vw,16px);line-height:1.5;margin-top:.55em;
  }

  .wordlayer{position:absolute;inset:0;pointer-events:none}
  .word{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
  .chip{
    display:inline-flex;align-items:center;gap:11px;white-space:nowrap;
    padding:10px 18px 10px 15px;border-radius:999px;
    border:1px solid rgba(239,227,212,.22);
    background:rgba(7,5,3,.42);backdrop-filter:blur(12px) saturate(1.15);
    box-shadow:0 10px 34px rgba(7,5,3,.55), inset 0 1px 0 rgba(239,227,212,.07);
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--sand);
    opacity:0;transform:translateY(10px) scale(.94);will-change:opacity,transform;
  }
  .chip .pip{
    display:block;width:5px;height:5px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 4px rgba(227,176,114,.16), 0 0 14px rgba(227,176,114,.7);
    animation:pip 2.6s ease-in-out infinite;
  }
  @keyframes pip{
    0%,100%{box-shadow:0 0 0 4px rgba(227,176,114,.16), 0 0 14px rgba(227,176,114,.6)}
    50%{box-shadow:0 0 0 9px rgba(227,176,114,.04), 0 0 22px rgba(227,176,114,.95)}
  }
  @media (prefers-reduced-motion:reduce){.chip .pip{animation:none}}

  /* ---------- system annotations ---------- */
  .notelayer{position:absolute;inset:0;pointer-events:none}
  .leads{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .note{position:absolute;transform:translateY(-50%);opacity:0;will-change:opacity}
  .note .chip{opacity:1;transform:none}
  .chip.tag{
    gap:12px;padding:11px 21px 11px 17px;white-space:nowrap;
    font-family:var(--body);font-weight:400;
    font-size:clamp(11.5px,.92vw,13.5px);letter-spacing:.05em;text-transform:none;
    color:var(--sand);
    background:rgba(7,5,3,.55);border-color:rgba(239,227,212,.26);
  }
  .slide.hero .cap{font-size:clamp(19px,2vw,29px);line-height:1.3;max-width:34ch}

  .hud{
    position:fixed;left:clamp(20px,3.4vw,48px);bottom:clamp(22px,3.6vh,40px);z-index:30;
    display:flex;flex-direction:column;gap:6px;pointer-events:none;transition:opacity .6s ease;
    font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:rgba(239,227,212,.4);
  }
  .hud b{font-weight:300;color:var(--sand);letter-spacing:.3em}

  .scrollcue{
    position:fixed;bottom:clamp(22px,3.6vh,40px);left:50%;transform:translateX(-50%);z-index:30;
    transition:opacity .6s ease;
  }
  .scrollcue s{display:block;width:1px;height:46px;background:linear-gradient(var(--gold),transparent);animation:drop 2.4s ease-in-out infinite}
  @keyframes drop{0%{transform:scaleY(0);transform-origin:top}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

  /* ---------- closing slide ---------- */
  .slide.final{
    bottom:clamp(80px,12vh,132px);
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:clamp(24px,5vw,90px);
  }
  /* Soft black wash behind the closing copy. It lives OUTSIDE .slide on purpose:
     draw() puts a transform on .slide, which would make it the containing block
     for any position:fixed child and clip this to the slide's own box. */
  #wash{
    position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;
    transition:opacity .5s ease;
    /* long multi-stop ramps — a short falloff bands into a visible contour line */
    background:
      linear-gradient(to right,
        rgba(7,5,3,.50) 0%, rgba(7,5,3,.43) 13%, rgba(7,5,3,.35) 26%, rgba(7,5,3,.26) 39%,
        rgba(7,5,3,.18) 52%, rgba(7,5,3,.11) 65%, rgba(7,5,3,.05) 78%, rgba(7,5,3,.015) 90%,
        rgba(7,5,3,0) 100%),
      linear-gradient(to top,
        rgba(7,5,3,.80) 0%, rgba(7,5,3,.73) 8%, rgba(7,5,3,.65) 16%, rgba(7,5,3,.56) 24%,
        rgba(7,5,3,.47) 32%, rgba(7,5,3,.38) 40%, rgba(7,5,3,.30) 48%, rgba(7,5,3,.22) 56%,
        rgba(7,5,3,.16) 64%, rgba(7,5,3,.10) 72%, rgba(7,5,3,.06) 80%, rgba(7,5,3,.03) 88%,
        rgba(7,5,3,.01) 94%, rgba(7,5,3,0) 100%);
  }
  .slide.final .ch{color:var(--gold);letter-spacing:.44em}
  .slide.final .cap{
    font-size:clamp(26px,3.4vw,52px);line-height:1.08;letter-spacing:0;max-width:18ch;
  }
  .slide.final .cap i{
    font-family:var(--body);font-size:clamp(15px,1.15vw,19px);line-height:1.6;
    margin-top:1.15em;max-width:42ch;color:rgba(239,227,212,.78);
  }
  .cta{flex:0 0 auto;margin-bottom:.4em;pointer-events:auto}
  .btn{
    display:inline-flex;align-items:center;cursor:pointer;text-decoration:none;white-space:nowrap;
    padding:17px 34px;border-radius:999px;
    font-size:11px;font-weight:400;letter-spacing:.24em;text-transform:uppercase;color:var(--sand);
    /* no backdrop-filter here — the closing sequence repaints the canvas 16x/sec
       and re-sampling the backdrop each time makes the button strobe */
    background:linear-gradient(180deg, rgba(150,72,42,.62) 0%, rgba(96,44,26,.5) 100%);
    border:1px solid rgba(227,176,114,.46);
    box-shadow:0 12px 38px rgba(7,5,3,.45), inset 0 1px 0 rgba(255,235,214,.2);
    transition:background .35s ease,border-color .35s ease,color .35s ease,transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .btn:hover{
    transform:translateY(-2px);
    background:linear-gradient(180deg, rgba(203,142,84,.78) 0%, rgba(150,72,42,.66) 100%);
    border-color:rgba(227,176,114,.8);
  }
  @media (max-width:820px){
    .slide.final{flex-direction:column;align-items:flex-start;gap:22px}
    .cta{margin-bottom:0}
  }

  /* ---------- menu ---------- */
  #menu{
    position:fixed;inset:0;z-index:50;background:rgba(7,5,3,.92);backdrop-filter:blur(22px);
    display:grid;grid-template-columns:1fr;align-content:center;
    padding:clamp(88px,12vh,140px) clamp(24px,7vw,120px);
    opacity:0;visibility:hidden;transition:opacity .5s ease,visibility .5s;
  }
  body.menu-open #menu{opacity:1;visibility:visible}
  #menu nav{display:flex;flex-direction:column}
  #menu a{
    display:flex;align-items:baseline;gap:clamp(14px,2vw,30px);text-decoration:none;color:var(--sand);
    padding:clamp(10px,1.4vh,18px) 0;border-bottom:1px solid rgba(239,227,212,.08);
    font-family:var(--display);font-size:clamp(19px,3.2vw,44px);line-height:1.1;
    opacity:.55;transition:opacity .35s ease,padding-left .35s cubic-bezier(.2,.8,.2,1),color .35s;
  }
  #menu a:hover{opacity:1;padding-left:14px;color:var(--gold)}
  #menu a em{font-family:var(--body);font-style:normal;font-weight:300;font-size:10px;letter-spacing:.3em;color:rgba(239,227,212,.35)}
  .menu-foot{display:flex;flex-wrap:wrap;gap:clamp(24px,4vw,64px);margin-top:clamp(28px,5vh,60px);font-size:11px;letter-spacing:.16em;color:var(--sand-dim)}

  /* shutter for jumps between non-adjacent frames */
  #blink{
    position:fixed;inset:0;z-index:70;background:var(--ink);
    opacity:0;pointer-events:none;transition:opacity .26s ease;
  }

  /* a hint, never a gate — plenty of people have orientation lock on */
  #rotate{
    position:fixed;left:50%;bottom:clamp(74px,11vh,110px);z-index:45;
    display:flex;align-items:center;gap:12px;white-space:nowrap;cursor:pointer;
    padding:11px 20px 11px 16px;border-radius:999px;
    border:1px solid rgba(239,227,212,.22);
    background:rgba(7,5,3,.55);backdrop-filter:blur(12px) saturate(1.15);
    box-shadow:0 10px 34px rgba(7,5,3,.5), inset 0 1px 0 rgba(239,227,212,.07);
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--sand);
    opacity:0;transform:translate(-50%,10px);
    transition:opacity .7s ease,transform .8s cubic-bezier(.16,.84,.24,1);
  }
  #rotate.on{opacity:1;transform:translate(-50%,0)}
  #rotate svg{display:block;width:17px;height:17px;flex:0 0 auto;color:var(--gold)}
  #rotate svg .ph{animation:tilt 3.2s ease-in-out infinite;transform-origin:12px 12px}
  @keyframes tilt{
    0%,55%,100%{transform:rotate(0)}
    72%,88%{transform:rotate(-90deg)}
  }
  @media (prefers-reduced-motion:reduce){#rotate svg .ph{animation:none}}

  /* ---------- loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:90;background:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    transition:opacity .9s ease,visibility .9s;
  }
  #loader.done{opacity:0;visibility:hidden}
  #loader .oro{font-family:var(--display);font-size:clamp(30px,4vw,52px);letter-spacing:.04em}
  #bar{width:min(220px,42vw);height:1px;background:rgba(239,227,212,.15);overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s ease}
  #pct{font-size:9px;letter-spacing:.4em;color:var(--sand-dim)}

  @media (max-width:820px){
    .chip.tag{gap:9px;padding:8px 14px 8px 11px;font-size:11px;letter-spacing:.02em}
  }
  @media (max-width:760px){
    .dots{gap:11px;right:12px}
    .dot b{display:none}
    .slide{bottom:clamp(84px,13vh,120px)}
    header{padding:16px 18px}
  }
  @media (prefers-reduced-motion:reduce){.scrollcue s{animation:none}}
</style>
</head>
<body>

<div id="stage"><canvas id="frame"></canvas></div>

<header>
  <a class="lockup" href="#" id="brand">
    <span class="oro">ORO</span>
    <span class="sub">MARS RESIDENCES</span>
  </a>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<div id="grain"></div>
<div id="wash"></div>
<div class="dots" id="dots"><i class="rail" id="rail"></i></div>
<div class="copy-layer" id="copy"></div>

<div class="hud" id="hud">
  <b>AM 05:47</b>
  <span>ORO, Mars</span>
</div>
<div class="scrollcue" id="cue"><s></s></div>

<div id="rotate" role="status">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <rect class="ph" x="8" y="3" width="8" height="14" rx="1.6" stroke="currentColor" stroke-width="1.2"/>
    <path d="M4.6 15.4a8 8 0 0 0 14.8 2.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M19.8 14.2l-.4 3.9-3.7-1.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <span>Best viewed landscape</span>
</div>

<div id="menu">
  <nav id="menu-nav"></nav>
  <div class="menu-foot">
    <span>Sales Gallery · Aurora Vallis</span>
    <span>residences@oro.mars</span>
    <span>Launch Window 2041</span>
  </div>
</div>

<div id="spacer"></div>

<div id="blink"></div>

<div id="loader">
  <div class="oro">ORO</div>
  <div id="bar"><i></i></div>
  <div id="pct">PREPARING DESCENT · 0%</div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- content model ---------------- */
  var BASE = 'public/frames/';
  var SECTIONS = [
    { key:'hero', still:'public/hero.png', vh:85, label:'Origin', nav:'Origin',
      ch:'Aurora Vallis', cap:'Good morning.<i>You’re not on Earth anymore.</i>' },

    { key:'seq02', n:97, vh:170, label:'Arrival',   nav:'The Arrival',
      ch:'01 · The Arrival',    cap:'Morning looks different here<i>And this is only the view</i>' },

    { key:'seq03', n:97, vh:170, label:'Threshold', nav:'The Threshold',
      ch:'02 · The Threshold',   cap:'The view comes standard<i>Floor to horizon windows.<br>Mars, uninterrupted.</i>' },

    { key:'seq04', n:97, vh:170, label:'Interiors', nav:'The Great Room',
      ch:'03 · The Great Room',  cap:'Built for another planet,<br>Designed to feel like home.' },

    { key:'seq05', n:97, vh:170, label:'Promenade', nav:'The Promenade',
      ch:'04 · The Promenade',   cap:'A residential landscape,<br>designed for life on Mars.' },

    { key:'seq06', n:97, vh:280, label:'Systems',   nav:'The Systems',
      ch:'05 · The Systems',    cap:'The best technology is invisible<i>Until you want to see it.</i>',
      scrubTo:.55, panTo:.12,
      notes:[
        { t:.58, a:[.091,.334], l:[.150,.200], title:'Solar Energy Network' },
        { t:.66, a:[.129,.478], l:[.235,.470], title:'Closed Loop Air System' },
        { t:.74, a:[.319,.488], l:[.392,.598], title:'Biophilic Food Production' },
        { t:.82, a:[.150,.593], l:[.185,.700], title:'Water Recovery & Filtration' }
      ] },

    { key:'seq07', n:65, vh:115, label:'Residence', nav:'The Residence',
      ch:'', cap:'' },

    { key:'seq08', n:97, vh:170, label:'Community', nav:'The Community',
      ch:'06 · The Community',  cap:'A village under a foreign sun.' },

    { key:'seq09', n:105, vh:185, label:'Valley',    nav:'The Valley',
      ch:'07 · The Valley', cap:'Yours to the horizon.' },

    { key:'seq10', n:97, vh:175, label:'Reserve',   nav:'Reserve', loop:true,
      ch:'08 · The Reserve',
      cap:'Your next address is<br>already on the map<i>ORO Mars Residences,<br>Now all that’s missing is you.</i>',
      final:true, cta:'Find Your Residence' }
  ];

  var VIDEO_START = 1;               // section index where sequences begin
  var stage   = document.getElementById('stage');
  var canvas  = document.getElementById('frame');
  var ctx     = canvas.getContext('2d', { alpha:false });
  var spacer  = document.getElementById('spacer');
  var dotsEl  = document.getElementById('dots');
  var copyEl  = document.getElementById('copy');
  var navEl   = document.getElementById('menu-nav');
  var loader  = document.getElementById('loader');
  var barEl   = document.querySelector('#bar i');
  var pctEl   = document.getElementById('pct');
  var cueEl   = document.getElementById('cue');
  var hudEl   = document.getElementById('hud');
  var blinkEl = document.getElementById('blink');
  var washEl  = document.getElementById('wash');
  var railEl  = document.getElementById('rail');
  var hdrEl   = document.querySelector('header');

  /* lock "MARS RESIDENCES" to the exact width of "ORO" */
  function fitLockup(){
    var oro = document.querySelector('.lockup .oro');
    var sub = document.querySelector('.lockup .sub');
    if (!oro || !sub) return;
    sub.style.transform = 'none';
    var a = oro.getBoundingClientRect().width;
    var b = sub.getBoundingClientRect().width;
    if (a > 0 && b > 0) sub.style.transform = 'scaleX(' + (a / b) + ')';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLockup);
  setTimeout(fitLockup, 400);
  setTimeout(fitLockup, 1600);

  /* ---------------- build DOM ---------------- */
  var slides = [], dots = [], wordEls = SECTIONS.map(function(){ return null; });
  var noteEls = SECTIONS.map(function(){ return null; });
  var SVGNS = 'http://www.w3.org/2000/svg';
  SECTIONS.forEach(function(s, i){
    // slide
    var el = document.createElement('article');
    el.className = 'slide' + (i === 0 ? ' hero' : '') + (s.final ? ' final' : '');
    var html = s.cap ? ('<p class="ch">' + s.ch + '</p><p class="cap">' + s.cap + '</p>') : '';
    if (s.final) html = '<div class="fcopy">' + html + '</div>';
    if (s.cta){
      html += '<div class="cta">' +
        '<a class="btn" href="mailto:residences@oro.mars?subject=ORO%20Mars%20Residences%20—%20Private%20Consultation">' + s.cta + '</a>' +
        '</div>';
    }
    el.innerHTML = html;
    copyEl.appendChild(el);

    if (s.words){
      var wl = document.createElement('div');
      wl.className = 'wordlayer';
      wordEls[i] = s.words.map(function(w){
        var holder = document.createElement('div');
        holder.className = 'word';
        holder.style.left = w.x; holder.style.top = w.y;
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = '<i class="pip"></i>';
        chip.appendChild(document.createTextNode(w.text));
        holder.appendChild(chip);
        wl.appendChild(holder);
        return chip;
      });
      copyEl.appendChild(wl);
    }

    if (s.notes){
      var nl = document.createElement('div');
      nl.className = 'notelayer';
      var svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('class', 'leads');
      nl.appendChild(svg);

      noteEls[i] = s.notes.map(function(nt){
        var line = null, dot = null;
        if (nt.a){
          line = document.createElementNS(SVGNS, 'polyline');
          line.setAttribute('fill', 'none');
          line.setAttribute('stroke', 'rgba(239,227,212,.8)');
          line.setAttribute('stroke-width', '1');
          dot = document.createElementNS(SVGNS, 'circle');
          dot.setAttribute('r', '2.5');
          dot.setAttribute('fill', '#E3B072');
          svg.appendChild(line); svg.appendChild(dot);
        }

        var box = document.createElement('div');
        box.className = 'note';
        box.innerHTML = '<span class="chip tag"><i class="pip"></i>' + nt.title + '</span>';
        nl.appendChild(box);
        return { box:box, line:line, dot:dot, def:nt };
      });

      copyEl.appendChild(nl);
    }
    slides.push(el);

    // dot
    var d = document.createElement('button');
    d.className = 'dot';
    d.setAttribute('aria-label', s.nav);
    d.innerHTML = '<b>' + s.label + '</b><i></i>';
    d.addEventListener('click', function(){ goTo(i); });
    dotsEl.appendChild(d);
    dots.push(d);

  });

  /* main navigation — these become their own pages later.
     until then each one jumps to the matching moment in the scroll. */
  var MENU = [
    { label:'ORO',                 section:0 },
    { label:'The Collection',      href:'collection.html' },
    { label:'Life on Mars',        href:'life.html' },
    { label:'Reserve Your View',   section:9 }
  ];

  MENU.forEach(function(m, mi){
    var a = document.createElement('a');
    a.href = m.href || '#';
    a.innerHTML = '<em>' + String(mi + 1).padStart(2, '0') + '</em><span>' + m.label + '</span>';
    if (!m.href){
      a.addEventListener('click', function(e){ e.preventDefault(); closeMenu(); goTo(m.section); });
    }
    navEl.appendChild(a);
  });

  /* ---------------- layout / scroll geometry ---------------- */
  var bounds = [];  // [startPx, lengthPx] per section
  var total  = 0;

  function layout(){
    var vh = window.innerHeight;
    var y = 0;
    bounds = SECTIONS.map(function(s){
      var len = s.vh / 100 * vh;
      var b = [y, len];
      y += len;
      return b;
    });
    total = y;
    spacer.style.height = Math.round(total) + 'px';

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = Math.round(window.innerWidth  * dpr);
    canvas.height = Math.round(vh * dpr);
    canvas.style.width  = '100%';
    canvas.style.height = '100%';
    fitLockup();
    snapScroll();
    draw(true);
  }

  var blinking = false;

  function goTo(i){
    var target = Math.min(bounds[i][0] + (i === 0 ? 0 : bounds[i][1] * 0.42), total - 1);

    // neighbouring chapters scroll; anything further cuts across with a blink,
    // so you never watch the frames in between flick past
    if (Math.abs(i - active) <= 1){
      window.scrollTo({ top:target, behavior:'smooth' });
      return;
    }
    if (blinking) return;
    blinking = true;

    loadSection(i);
    blinkEl.style.opacity = '1';
    setTimeout(function(){
      window.scrollTo(0, target);
      snapScroll();
      draw(true);
      setTimeout(function(){          // let the new frame decode behind the black
        draw(true);
        blinkEl.style.opacity = '0';
        blinking = false;
      }, 300);
    }, 260);
  }

  /* ---------------- asset loading ---------------- */
  var assets = SECTIONS.map(function(){ return null; });   // arrays of Image
  var ready  = SECTIONS.map(function(){ return false; });
  var loadedCount = 0, totalToLoad = 0;

  function src(s, k){
    return BASE + s.key + '/' + String(k).padStart(4, '0') + '.jpg';
  }

  function loadSection(i, onDone){
    if (assets[i]) { if (onDone) onDone(); return; }
    var s = SECTIONS[i];
    if (s.still){
      var img = new Image();
      assets[i] = [img];
      img.onload = img.onerror = function(){ ready[i] = true; bump(); if (onDone) onDone(); draw(true); };
      img.src = s.still;
      totalToLoad += 1;
      return;
    }
    var list = new Array(s.n), left = s.n;
    assets[i] = list;
    totalToLoad += s.n;
    var next = 0, CONC = 8;
    function pump(){
      while (next < s.n && CONC-- > 0) fire(next++);
    }
    function fire(k){
      var im = new Image();
      list[k] = im;
      im.onload = im.onerror = function(){
        bump();
        if (k < 2) draw(true);
        if (--left === 0){ ready[i] = true; if (onDone) onDone(); }
        if (next < s.n) fire(next++);
      };
      im.src = src(s, k + 1);
    }
    pump();
  }

  function bump(){
    loadedCount++;
    if (!bootDone){
      var p = Math.min(100, Math.round(loadedCount / bootTarget * 100));
      barEl.style.width = p + '%';
      pctEl.textContent = 'PREPARING DESCENT · ' + p + '%';
    }
  }

  /* boot: hero + first sequence, then the rest in the background */
  var bootDone = false;
  var bootTarget = 1 + SECTIONS[1].n;

  function finishBoot(){
    if (bootDone) return;
    bootDone = true;
    barEl.style.width = '100%';
    pctEl.textContent = 'PREPARING DESCENT · 100%';
    setTimeout(function(){ loader.classList.add('done'); }, 420);
    // background-load everything else, in narrative order
    var i = 2;
    (function chain(){
      if (i >= SECTIONS.length) return;
      var cur = i++;
      loadSection(cur, chain);
    })();
  }

  var bootLeft = 2;
  loadSection(0, function(){ if (--bootLeft === 0) finishBoot(); });
  loadSection(1, function(){ if (--bootLeft === 0) finishBoot(); });
  setTimeout(finishBoot, 9000); // never trap the user behind the loader

  /* ---------------- painting ---------------- */
  var lastPainted = null;

  /* Horizontal anchor of the cover-crop. 0.5 centres; 0 hugs the left edge.
     On a wide viewport the frame barely overflows, so this does almost nothing —
     on a narrow one it is the difference between seeing the building and not. */
  var focusX = .5;

  function focusFor(i, t){
    var s = SECTIONS[i];
    if (s.panTo === undefined) return .5;
    var inEnd = s.scrubTo || .5, outStart = .90, k;
    if (t <= inEnd) k = t / inEnd;
    else if (t < outStart) k = 1;
    else k = Math.max(0, 1 - (t - outStart) / (1 - outStart));
    k = k * k * (3 - 2 * k);                       // smoothstep, so it drifts
    return .5 + (s.panTo - .5) * k;
  }

  function paint(img){
    if (!img || !img.naturalWidth) { img = lastPainted; }
    if (!img || !img.naturalWidth) return;
    lastPainted = img;
    var cw = canvas.width, ch = canvas.height;
    var scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
    var w = img.naturalWidth * scale, h = img.naturalHeight * scale;
    ctx.drawImage(img, (cw - w) * focusX, (ch - h) / 2, w, h);
  }

  function pick(i, t){
    var list = assets[i];
    if (!list || !list.length) return null;
    if (list.length === 1) return list[0];
    var k = Math.round(t * (list.length - 1));
    k = Math.max(0, Math.min(list.length - 1, k));
    // walk back to the nearest decoded frame so gaps never flash black
    for (var j = k; j >= 0; j--) if (list[j] && list[j].naturalWidth) return list[j];
    for (var j2 = k; j2 < list.length; j2++) if (list[j2] && list[j2].naturalWidth) return list[j2];
    return null;
  }

  var active = -1;
  var loopIdx = 0, loopLast = 0;

  /* annotations live in IMAGE space, so they stay pinned to the building
     no matter how the cover-fit crops the frame at this viewport */
  function layoutNotes(i, t){
    for (var ni = 0; ni < noteEls.length; ni++){
      var list = noteEls[ni];
      if (!list) continue;
      var on = (ni === i);
      var img = lastPainted;
      var sw = canvas.clientWidth, sh = canvas.clientHeight;
      var k = (img && img.naturalWidth) ? Math.max(sw / img.naturalWidth, sh / img.naturalHeight) : 1;
      var dw = img ? img.naturalWidth * k : sw, dh = img ? img.naturalHeight * k : sh;
      var ox = (sw - dw) * focusX, oy = (sh - dh) / 2;
      // the legend exists because a portrait screen has no horizontal room —
      // turn the phone and the anchored labels come back on their own
      var narrow = sw < 820 && sh >= sw;
      // measured off the real header, so the legend clears the logo at any size
      // The list sits in the band between the logo and the roofline, centred in it,
      // tightening its spacing rather than spilling onto the building.
      var LEG_X = 16;
      var boxH = (list[0] && list[0].box) ? list[0].box.offsetHeight : 30;
      var bandTop = (hdrEl ? hdrEl.getBoundingClientRect().bottom : 88) + 16;
      var bandBot = sh * .42;
      // rows may tighten to fit, but never closer than their own height plus a gap —
      // overlapping labels are unreadable, whereas grazing the roofline is not
      var minRow = boxH + 8;
      var LEG_ROW = 38;
      if ((list.length - 1) * LEG_ROW + boxH > bandBot - bandTop){
        LEG_ROW = Math.max(minRow, (bandBot - bandTop - boxH) / Math.max(1, list.length - 1));
      }
      // anchored under the logo rather than centred, so it stays clear of the building
      var LEG_TOP = bandTop + boxH / 2;

      for (var nj = 0; nj < list.length; nj++){
        var n = list[nj], def = n.def, o = 0;
        if (on){
          var tin = def.t, fin = .05, tout = .95, fout = .04;
          if (t > tin) o = Math.min((t - tin) / fin, t > tout ? Math.max(0, 1 - (t - tout) / fout) : 1);
          o = Math.max(0, Math.min(1, o));
        }
        n.box.style.opacity = o;
        if (n.line) n.line.style.opacity = o;
        if (n.dot)  n.dot.style.opacity  = o;
        if (o <= .01) continue;

        var ax = def.a ? ox + def.a[0] * dw : 0;
        var ay = def.a ? oy + def.a[1] * dh : 0;

        if (narrow){
          /* A portrait screen has no room beside the building, so the labels
             become a plain list and the frame is left completely clean. */
          n.box.style.left = LEG_X + "px";
          n.box.style.top  = (LEG_TOP + nj * LEG_ROW) + "px";
          if (n.line) n.line.style.opacity = 0;
          if (n.dot)  n.dot.style.opacity  = 0;
          continue;
        }

        var bw = n.box.offsetWidth;
        var lx = ox + def.l[0] * dw, ly = oy + def.l[1] * dh;
        lx = Math.max(12, Math.min(lx, sw - bw - 12));
        n.box.style.left = lx + 'px';
        n.box.style.top  = ly + 'px';
        if (!def.a) continue;

        n.dot.setAttribute('cx', ax); n.dot.setAttribute('cy', ay);
        // the leader leaves from whichever edge of the label faces the anchor
        var attach = (ax > lx + bw / 2) ? (lx + bw + 8) : (lx - 8);
        var elbow  = (ax > lx + bw / 2) ? (lx + bw + 24) : (lx - 24);
        n.line.setAttribute('points',
          attach + ',' + ly + ' ' + elbow + ',' + ly + ' ' + ax + ',' + ay);
      }
    }
  }

  /* the frames are driven by a smoothed scroll position rather than the raw one —
     this is what gives the sequence its weight instead of a 1:1 twitch */
  var sy = 0;

  function snapScroll(){ sy = window.scrollY || window.pageYOffset; }

  function current(){
    var y = sy;
    for (var i = SECTIONS.length - 1; i >= 0; i--){
      if (y >= bounds[i][0] - 1) return [i, Math.max(0, Math.min(1, (y - bounds[i][0]) / bounds[i][1]))];
    }
    return [0, 0];
  }

  function draw(force){
    var c = current(), i = c[0], t = c[1];
    focusX = focusFor(i, t);

    if (SECTIONS[i].loop){
      paint(pick(i, loopIdx / Math.max(1, (assets[i] ? assets[i].length : 1) - 1)));
    } else {
      // scrubTo: the sequence plays out over the first slice, then holds for the annotations
      var tf = SECTIONS[i].scrubTo ? Math.min(1, t / SECTIONS[i].scrubTo) : t;
      paint(pick(i, tf));
    }

    layoutNotes(i, t);

    // copy: visible in the middle of a section, faded at the seams
    for (var s = 0; s < slides.length; s++){
      var o = 0;
      if (s === i){
        if (s === 0){
          // nothing on the very first frame — the line arrives after a small scroll
          o = t < .05 ? 0 : (t < .15 ? (t - .05) / .10 : (t > .72 ? Math.max(0, 1 - (t - .72) / .18) : 1));
        } else if (SECTIONS[s].loop || SECTIONS[s].notes){
          o = t < .12 ? t / .12 : 1;
        } else {
          o = t < .12 ? t / .12 : (t > .78 ? Math.max(0, 1 - (t - .78) / .18) : 1);
        }
      }
      var el = slides[s];
      if (el._o !== o){
        el._o = o;
        el.style.opacity = o;
        el.style.visibility = o > .02 ? 'visible' : 'hidden';
        // the children stagger themselves in via .in — see the CSS
        el.classList.toggle('in', o > .35);
      }
    }

    for (var wi = 0; wi < wordEls.length; wi++){
      var wlist = wordEls[wi];
      if (!wlist) continue;
      for (var wj = 0; wj < wlist.length; wj++){
        var wo = 0;
        if (wi === i){
          var win = SECTIONS[wi].words[wj].t, a = win[0], b = win[1], f = .07;
          if (t > a && t < b) wo = Math.min(1, Math.min((t - a) / f, (b - t) / f));
        }
        var e = Math.max(0, Math.min(1, wo));
        wlist[wj].style.opacity = e;
        wlist[wj].style.transform = 'translateY(' + ((1 - e) * 10) + 'px) scale(' + (0.94 + 0.06 * e) + ')';
      }
    }

    cueEl.style.opacity = (i === 0 && t < .05) ? '1' : '0';
    washEl.style.opacity = SECTIONS[i].final ? (t < .12 ? t / .12 : 1) : 0;
    railEl.style.transform = 'scaleY(' + Math.max(0, Math.min(1, sy / Math.max(1, total - window.innerHeight))) + ')';
    hudEl.style.opacity = (i === 0) ? '1' : '0';

    if (i !== active || force){
      active = i;
      for (var d = 0; d < dots.length; d++) dots[d].classList.toggle('active', d === i);
      // keep the next chapter warm
      if (i + 1 < SECTIONS.length && !assets[i + 1]) loadSection(i + 1);
    }
  }

  /* one loop drives everything: eased scroll, the closing sequence, the rail */
  function tick(now){
    var target = window.scrollY || window.pageYOffset;
    var d = target - sy;
    if (Math.abs(d) > 0.35){
      sy += d * 0.135;
      draw(false);
    } else if (sy !== target){
      sy = target;
      draw(false);
    }

    var i = active;
    if (i >= 0 && SECTIONS[i] && SECTIONS[i].loop && assets[i]){
      if (now - loopLast > 62){
        loopLast = now;
        loopIdx = (loopIdx + 1) % assets[i].length;
        paint(pick(i, loopIdx / Math.max(1, assets[i].length - 1)));
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* ---------------- events ---------------- */
  window.addEventListener('scroll', function(){}, { passive:true });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 250); });

  var burger = document.getElementById('burger');
  function closeMenu(){ document.body.classList.remove('menu-open'); burger.setAttribute('aria-expanded','false'); }
  burger.addEventListener('click', function(){
    var open = document.body.classList.toggle('menu-open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeMenu();
    if (e.key === 'ArrowDown' || e.key === 'PageDown'){ e.preventDefault(); goTo(Math.min(SECTIONS.length - 1, active + 1)); }
    if (e.key === 'ArrowUp'   || e.key === 'PageUp'  ){ e.preventDefault(); goTo(Math.max(0, active - 1)); }
  });
  document.getElementById('brand').addEventListener('click', function(e){
    e.preventDefault(); window.scrollTo({ top:0, behavior:'smooth' });
  });

  /* ---------------- rotate hint ---------------- */
  /* A suggestion, not a wall: it never blocks, it disappears by itself, and it
     stays gone once dismissed or once the phone is actually turned. */
  (function(){
    var el = document.getElementById('rotate');
    if (!el) return;
    var done = false, timer = 0;

    function portraitPhone(){
      return window.innerWidth < 820 && window.innerHeight > window.innerWidth;
    }
    function hide(){
      done = true;
      el.classList.remove('on');
      clearTimeout(timer);
    }
    function maybeShow(){
      if (done) return;
      if (!portraitPhone()){ hide(); return; }   // already landscape: nothing to suggest
      el.classList.add('on');
      timer = setTimeout(function(){ el.classList.remove('on'); }, 6200);
    }

    el.addEventListener('click', hide);
    window.addEventListener('orientationchange', function(){ setTimeout(hide, 300); });
    window.addEventListener('resize', function(){
      if (!portraitPhone()) hide();
    });
    setTimeout(maybeShow, 1400);
  })();

  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  layout();
  window.scrollTo(0, 0);
  snapScroll();
  draw(true);
})();
</script>
</body>
</html>
